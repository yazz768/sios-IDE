name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: ''
          - platform: windows-latest
            target: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev

      - name: Install frontend dependencies
        run: npm install

      - name: Build & publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Sios IDE ${{ github.ref_name }}'
          releaseBody: |
            ## Sios IDE ${{ github.ref_name }}

            Idea Management & Productivity System — Desktop App

            ### Download
            | Platform | File |
            |---|---|
            | Linux (Debian/Ubuntu) | `.deb` |
            | Linux (Universal)     | `.AppImage` |
            | Windows               | `.msi` atau `.exe` |

            ### Cara Install
            **Linux:**
            ```bash
            # Debian/Ubuntu
            sudo dpkg -i sios-ide_*.deb

            # AppImage
            chmod +x sios-ide_*.AppImage && ./sios-ide_*.AppImage
            ```
            **Windows:** Jalankan file `.msi` atau `.exe` dan ikuti wizard installer.
          releaseDraft: true
          prerelease: false
